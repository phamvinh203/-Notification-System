services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      DB_PATH: /app/data/notifications.db
      # demo key cho compose — đổi hoặc xóa để tắt auth
      API_KEY: dev-secret-123
      FAIL_RATE: "0.3"
      DASHBOARD_DIST: /app/dashboard-dist
      # HMAC webhook + link unsubscribe (giá trị thật trong .env — xem .env.example)
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 tường minh — wget resolving "localhost" sang ::1 sẽ refused vì Node listen IPv4
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["npx", "tsx", "src/start-worker.ts"]
    environment:
      REDIS_URL: redis://redis:6379
      DB_PATH: /app/data/notifications.db
      FAIL_RATE: "0.3"
      # ===== Provider email/SMS — giá trị thật nằm trong file .env (KHÔNG commit) =====
      # Mẫu: .env.example. Copy .env.example → .env, điền credentials, rồi:
      #   docker compose up -d worker
      # Thêm preset Ethereal (SMTP thật zero-config): SMTP_PRESET=ethereal trong .env
      EMAIL_MODE: ${EMAIL_MODE:-mock}
      SMTP_PRESET: ${SMTP_PRESET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: "${EMAIL_FROM:-}"
      SMS_MODE: ${SMS_MODE:-mock}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      # worker fan-out broadcast cần secret + base URL để sinh link unsubscribe theo recipient
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana-oss:11.1.0
    ports:
      - "3001:3000"
    environment:
      # demo — đổi password khi dùng thật
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
