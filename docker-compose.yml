services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      DB_PATH: /app/data/notifications.db
      # demo key cho compose — đổi hoặc xóa để tắt auth
      API_KEY: dev-secret-123
      FAIL_RATE: "0.3"
      DASHBOARD_DIST: /app/dashboard-dist
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 tường minh — wget resolving "localhost" sang ::1 sẽ refused vì Node listen IPv4
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["npx", "tsx", "src/start-worker.ts"]
    environment:
      REDIS_URL: redis://redis:6379
      DB_PATH: /app/data/notifications.db
      FAIL_RATE: "0.3"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana-oss:11.1.0
    ports:
      - "3001:3000"
    environment:
      # demo — đổi password khi dùng thật
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
