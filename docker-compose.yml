services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      DB_PATH: /app/data/notifications.db
      # demo key cho compose — đổi hoặc xóa để tắt auth
      API_KEY: dev-secret-123
      FAIL_RATE: "0.3"
      DASHBOARD_DIST: /app/dashboard-dist
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 tường minh — wget resolving "localhost" sang ::1 sẽ refused vì Node listen IPv4
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["npx", "tsx", "src/start-worker.ts"]
    environment:
      REDIS_URL: redis://redis:6379
      DB_PATH: /app/data/notifications.db
      FAIL_RATE: "0.3"
      # ===== EMAIL THẬT =====
      # SMTP thật zero-config (xem thư online qua link trong timeline, KHÔNG vào inbox cá nhân):
      # EMAIL_MODE: smtp
      # SMTP_PRESET: ethereal
      # SMTP vào inbox thật (VD Gmail: SMTP_HOST=smtp.gmail.com, SMTP_SECURE=true, SMTP_PORT=465,
      #   SMTP_USER=<email>, SMTP_PASS=<app-password 16 ký tự>):
      # EMAIL_MODE: smtp
      # SMTP_HOST: smtp.gmail.com
      # SMTP_SECURE: "true"
      # SMTP_PORT: "465"
      # SMTP_USER: you@gmail.com
      # SMTP_PASS: xxxx xxxx xxxx xxxx
      # EMAIL_FROM: "Notification <you@gmail.com>"
      # Hoặc Resend (inbox thật, cần API key miễn phí tại resend.com):
      # EMAIL_MODE: resend
      # RESEND_API_KEY: re_xxxxxxxx
      # RESEND_FROM: "Notification <onboarding@resend.dev>"
      # ===== SMS THẬT (Twilio trial — chỉ gửi tới số đã verify) =====
      # SMS_MODE: twilio
      # TWILIO_ACCOUNT_SID: ACxxxxxxxx
      # TWILIO_AUTH_TOKEN: xxxxxxxx
      # TWILIO_FROM: "+1xxxxxxxxxx"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana-oss:11.1.0
    ports:
      - "3001:3000"
    environment:
      # demo — đổi password khi dùng thật
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
